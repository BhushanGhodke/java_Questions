<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Questions</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
	crossorigin="anonymous">

<style>
.quest{

margin-bottom: 2px;
color:purple;
font-size: large;

}
.container-fluid{
  background-color: rgb(171, 204, 233);
  font-size: 20px;
  padding: 10px;
  
}
.container{
margin-top: 60px
}
.textarea{
display: flex;
height: auto;
}


</style>

<script>
	
</script>

</head>
<body>


  <div class="container-fluid fixed-top">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start ">
        
          <ul class="nav col-12 col-lg-auto  justify-content-center my-md-0 text-small">

   <li class="nav-item">
        <a class="navbar-brand" href="/">Java Question & Answers</a>
      </li>
      
        <li class="nav-item" style="margin-left: 20px">
          <a class="navbar-brand"  href="/add">Add Question</a>
        </li>
    
      </ul>
   
    </div>
    </div>


	<div class="container d-flex flex-wrap">
	
	
		<tr th:each="q:${questions}"> 
		 
	        <div class="card" style="margin: 5px">
	        
	        <div class="card-header">
	        
	        	<p class="quest" > Question:  <span th:text="${q.question}"></span></p>
	
	        </div>
	        
	        <div class="card-body">
	        
	         <p style="margin-top: 2px ;font: bold;color: black;">
	  Answer:
	  <textarea class="textarea" wrap="soft" rows="2" cols="120"  th:text="${q.answer}" readonly="readonly" style="text-align: justify;" ></textarea>
	   	      
<!-- 	     <a th:href="@{'/delete/'+ ${q.questionId}}" th:text="delete" class="btn btn-warning"></a>  -->	     
	      <a th:href="@{'/update/'+ ${q.questionId}}" th:text="update" class="btn btn-warning"></a>  
	  
	  </p>
	        </div>
	        
	        </div>
		
	
	 
     
		</tr>

  </div>



	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
		crossorigin="anonymous">
		
	</script>
</body>
</html>
